# Runs dkit's checks on every push to main and every pull request:
#   cli      typecheck, lint, the tests and the build, on Windows, macOS and Linux, with Node.js 22 and 24
#   website  typecheck and a full static build of website/ (once, on Linux: it doesn't depend on the OS)
# The tests run on a fake machine (tests/helpers.ts), so CI never installs real software.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # a "Run workflow" button in the Actions tab

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: the workflow only checks code, it never writes to the repository.
permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false # one OS failing still shows the results of the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: The CLI starts
        run: node dist/index.js --version

  website:
    name: Website build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # The build generates next-env.d.ts (not in git), which the typecheck needs, so it comes first.
      - run: npm run build
      - run: npm run typecheck
